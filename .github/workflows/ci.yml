name: GTA7 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: gta7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build plugin jar
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # JDK 25, not 21: pom.xml's maven.compiler.source/target=21 only pins
      # this plugin's own OUTPUT bytecode version. paper-api
      # 26.2.build.97-stable's own class files are themselves compiled for
      # a newer JDK than 21 can read -- confirmed by reproducing this
      # exact failure locally ("bad class file" on every org.bukkit.*
      # class) with a real JDK 21, and confirming BUILD SUCCESS with JDK
      # 25. Matches EINHORN_SURVIVAL/jdk25, the JDK this repo's own
      # CLAUDE.md already documents using for local builds/deploys.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # No test suite exists yet in plugin/src (this is a Paper plugin --
      # real gameplay verification needs a live connected client, which
      # nothing in CI can provide). This job is a build gate only: does the
      # plugin compile clean against the pinned paper-api version.
      - name: mvn package
        working-directory: plugin
        run: mvn -B package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: gta7-plugin-${{ github.run_number }}-${{ github.sha }}
          path: plugin/target/gta7-*.jar
          if-no-files-found: error

      # Real gap closed 2026-08-25 (S202-19): every other active repo with real CI
      # already had a *_CONSTRUCT.txt build artifact (a full concatenation of its
      # own source, matching emily.cli's own ci.yml "Generate Construct Bundle"
      # step) -- GTA7 was one of 9 confirmed missing it (S202-18's audit).
      - name: Generate Construct Bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="GTA7_CONSTRUCT.txt"
          {
            echo "GTA7 CONSTRUCT ${{ github.run_number }}"
            echo "commit: $GITHUB_SHA"
            echo "generated_utc: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo
          } > "$OUT"

          while IFS= read -r relpath; do
            {
              echo "--- FILE START: ${relpath} ---"
              cat "${relpath}"
              echo
              echo "--- FILE END: ${relpath} ---"
              echo
            } >> "$OUT"
          done < <(
            find . \
              \( \
                -path './.git' \
                -o -path '*/target' \
              \) -prune -o \
              -type f \
              \( \
                -name '*.java' -o -name 'pom.xml' -o -name '*.yml' -o \
                -name '*.yaml' -o -name '*.md' -o -name '*.sh' \
              \) \
              ! -name "$OUT" \
              -print | sed 's#^./##' | LC_ALL=C sort
          )

          test -s "$OUT"

      - name: Upload Construct Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA7_Construct_${{ github.run_number }}_${{ github.sha }}
          path: GTA7_CONSTRUCT.txt
          if-no-files-found: error

  # Founder real-time: "ensure all our core repos have auto release non pre release" -- same
  # exact pattern PITVIPER's own ci.yml established (2026-08-21), also just applied to several
  # other core repos this session: auto-bumps MINOR version only on every real push to main
  # (never PRs, never the tag-push this job's own release step triggers), major stays a human
  # call. A REAL release (no --prerelease flag) with the built plugin jar attached -- real
  # versioned-rollback value even though this plugin is actually deployed by a manual `cp` into
  # EINHORN_SURVIVAL/server/plugins/ (see this repo's own CLAUDE.md), not downloaded by end users.
  release:
    name: 🚀 Tag & Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 -- need the full tag history to find the current version;
      # actions/checkout's own default shallow clone doesn't reliably include tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: gta7-plugin-${{ github.run_number }}-${{ github.sha }}
          path: dist

      - name: Compute next minor version
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0
            minor=0
          else
            ver="${latest#v}"
            major="$(echo "$ver" | cut -d. -f1)"
            minor="$(echo "$ver" | cut -d. -f2)"
          fi
          next_minor=$((minor + 1))
          next="v${major}.${next_minor}.0"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
          gh release create "$NEXT_VERSION" \
            dist/gta7-*.jar \
            --title "$NEXT_VERSION" \
            --generate-notes
