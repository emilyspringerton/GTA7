name: GTA7
version: 0.1.0
main: industrial.einhorn.gta7.GTA7Plugin
api-version: '1.21'
commands:
  flow:
    description: Check your Flow balance and how many Field Offices you hold.
    usage: /flow
  faction:
    description: View or join a GTA7 faction.
    usage: /faction [join <FREQUENCY|BLOC|PROCUREMENT>]
  gta7tv:
    description: Place a broadcast TV showing recent GTA7 city activity.
    usage: /gta7tv
  gta7jail:
    description: (Op only) Set the Custody Lock jail location to your current position.
    usage: /gta7jail
  gta7hospital:
    description: (Op only) Set CRAZY_KRANKENVAGEN's hospital delivery point to your current position.
    usage: /gta7hospital
  sudoku:
    description: Self-KO to respawn -- use if you're stuck in terrain.
    usage: /sudoku
